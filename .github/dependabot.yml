# Grouped so an ecosystem's routine bumps arrive as ONE pull request instead of
# one per dependency. The build standard records what ungrouped bumps cost at
# scale: a backlog in the thousands, none of it carrying any CI signal because the
# only workflow fired on push to main.
#
# Majors are deliberately left OUT of the npm group. Grouping a breaking major
# together with the safe bumps makes the whole pull request unmergeable, which is
# the hand-unpicking this exists to prevent -- the build standard records a backlog
# landing where the held-back bumps were overwhelmingly majors for that reason.
#
# Three this lab should expect, all load-bearing here:
#   - typescript 7 stops tolerating an undeclared side-effect import, which is why
#     src/vite-env.d.ts exists at all (without it `import './style.css'` fails
#     with TS2882);
#   - vitest 4 enforces timeouts by elapsed time rather than by racing a timer, so
#     this lab's ten-thousand-candidate recovery tests carry explicit per-test
#     budgets rather than relying on a body that only ever awaits resolved
#     promises starving the macrotask queue;
#   - @axe-core/playwright decides for itself which contrast questions it can
#     answer. On the version pinned today it resolves every color-mix() fill on
#     this page and reports nothing as `incomplete`; e2e/contrast.ts measures the
#     same ratios independently and says so, so a bump that changes axe's mind in
#     either direction is caught by one of the two rather than silently narrowing
#     the gate.
#
# github-actions majors ARE grouped, on the build standard's recommendation: the
# checkout, setup-node and Pages major jumps are recorded there as verified.
#
# Both groups auto-merge once this lab's own gate passes on the pull request --
# see the dependabot-auto-merge job in .github/workflows/deploy.yml, which hangs
# off the same `build` job the deploy does, so a bump cannot clear a lighter gate
# than the one that publishes.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
